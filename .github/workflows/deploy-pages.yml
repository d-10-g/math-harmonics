name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:midi
      - run: npm run validate:prism
      - run: npm run validate:prism-channels
      - run: npm run validate:glb-flight
      - run: npm run validate:static-flight
      - run: npm run validate:mixed-flight
      - run: npm run validate:flight-effects
      - run: npm run validate:flight-fireworks
      - run: npm run validate:flight-motion
      - run: npm run validate:flight-scenes
      - run: npm run validate:materials
      - run: npm run validate:state
      - run: npm run validate:menus
      - run: npm run validate:layouts
      - run: npm run validate:models
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
